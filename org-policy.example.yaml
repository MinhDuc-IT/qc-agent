required_capabilities:
  - security.secrets

kill_switches:
  capabilities: []
  implementations: []
  repositories: []
  domains: []

thresholds:
  triage_min_conf: 0.9
  max_confirmation_tasks_per_finding: 1

verdict:
  fail_on_worker_failure: true
  fail_on_severity: [critical, high]

